[package]
name = "keylock"
version = "0.1.0"
edition = "2021"
description = "Run a command behind an input lock so stray keys can't interrupt it"
license = "MIT"
repository = "https://github.com/bayoudhi/keylock"

[dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
